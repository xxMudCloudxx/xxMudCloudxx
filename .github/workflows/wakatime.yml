name: Waka Readme

on:
  schedule:
    # Runs at a specific time, e.g., every day at midnight UTC (adjust cron as needed)
    - cron: "0 0 * * *" # Example: Runs daily at midnight UTC. The example used '30 18 * * *'
  workflow_dispatch: # Allows manual run

jobs:
  update-readme:
    name: Update Readme with WakaTime Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master # Action to fetch WakaTime stats
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }} # Your WakaTime API Key
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub Token to allow README updates
          SHOW_LOC_CHART: False # Set to True if you want a Lines of Code chart
          # Add other options here as needed from anmol098/waka-readme-stats documentation
          # e.g., SHOW_PROJECTS, SHOW_PROFILE_VIEWS, etc.
          # The example README had a more detailed WakaTime output, which might require additional flags
          # or rely on the default behavior of the action to insert between and ```
