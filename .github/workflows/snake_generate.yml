name: generate-snake

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" #

  # Allow manual triggering
  workflow_dispatch: #

  # Run on push to the main/master branch
  push:
    branches:
      - main # Or main, depending on your default branch name

jobs:
  generate:
    permissions:
      contents: write # Needs write permission to push to the output branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3 #
        with:
          github_user_name: ${{ github.repository_owner }} # This will correctly use xxMudCloudxx
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark #
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0 #
        with:
          target_branch: output # Pushes to a branch named 'output'
          build_dir: dist # The directory containing the generated SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Use the default GITHUB_TOKEN
